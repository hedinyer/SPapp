name: spappweb tests

on:
  pull_request:
    paths:
      - "spappweb/**"
      - ".github/workflows/spappweb-test.yml"
  push:
    branches: [main]
    paths:
      - "spappweb/**"
      - ".github/workflows/spappweb-test.yml"

defaults:
  run:
    working-directory: spappweb

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spappweb/package-lock.json
      - run: npm ci
      - run: npm run check:all

  e2e-cliente:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spappweb/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=cliente --project=resilience
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}

  e2e-auth:
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spappweb/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=admin --project=visitador
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
          E2E_VISITADOR_USER: ${{ secrets.E2E_VISITADOR_USER }}
          E2E_VISITADOR_PASS: ${{ secrets.E2E_VISITADOR_PASS }}
          E2E_CONTRACT_ID: ${{ secrets.E2E_CONTRACT_ID }}
